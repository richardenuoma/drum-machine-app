<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="drum-machine">
      <div id="pad-bank">
        <button class="drum-pad" id="Heater-1">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>Q</button>
        <button class="drum-pad" id="Heater-2.">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>W</button>
        <button class="drum-pad" id="Heater-3">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>E</button>
        <button class="drum-pad" id="Heater-4_1">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>A</button>
        <button class="drum-pad" id="Heater-6">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>S</button>
        <button class="drum-pad" id="Dsc_Oh">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>D</button>
        <button class="drum-pad" id="Kick_n_Hat">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>Z</button>
        <button class="drum-pad" id="RP4_KICK_1">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>X</button>
        <button class="drum-pad" id="Cev_H2">
          <audio src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>C</button>
      </div>
      <div id="power-container">
        <p>Power: <span id="status">Off</span></p> 
        <div id="control">
        </div>
      </div>

      <p id="display"></p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
